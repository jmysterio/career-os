<!doctype html>
<html lang="en" data-theme="{{ theme }}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My work notebook</title>
<style>
:root[data-theme=dark]{--bg:#1c1917;--card:#26221f;--text:#efe8dd;--muted:#a89f93;--line:#3b352f;
  --accent:#e3a857;--accent-text:#1c1917;--good:#9ccc9c;--note-bg:#33291d;--note-line:#6b5530;
  --btn:#332e29;--c-happened:#7fb0e0;--c-did:#e3a857;--c-why:#b79af0}
:root[data-theme=light]{--bg:#faf6ef;--card:#fffdf8;--text:#2b2620;--muted:#7a6f62;--line:#e4dccd;
  --accent:#b7701f;--accent-text:#fffdf8;--good:#3d7a3d;--note-bg:#fff3d6;--note-line:#e0c36a;
  --btn:#f1e9da;--c-happened:#2b6cb0;--c-did:#b7701f;--c-why:#6b46c1}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,sans-serif;
  margin:0 auto;max-width:860px;padding:1.5rem 1.25rem 4rem}
h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:600;margin:0}
h1{font-size:1.9rem}h2{font-size:1.35rem}
h3{font-size:1.02rem;color:var(--muted);margin:1.4rem 0 .3rem;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.sub{color:var(--muted);margin:.2rem 0 0}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:.55rem .9rem;margin:1rem 0;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem;margin:1.4rem 0}
.item{border-left:4px solid var(--line);padding:.3rem 0 .3rem .9rem;margin:.7rem 0}
.item.happened{border-color:var(--c-happened)}.item.did{border-color:var(--c-did)}.item.why{border-color:var(--c-why)}
.chip{display:inline-block;font-size:.76rem;border-radius:99px;padding:.05rem .6rem;margin-left:.4rem;
  background:var(--btn);color:var(--muted);vertical-align:middle}
.chip.done{color:var(--good)}
.muted{color:var(--muted);font-size:.88rem}
details{margin:.25rem 0}summary{cursor:pointer;color:var(--muted);font-size:.88rem}
blockquote{margin:.3rem 0 .3rem .2rem;padding-left:.8rem;border-left:2px solid var(--line);color:var(--muted)}
code{font-size:.76rem;color:var(--muted)}
.attn{color:var(--accent);font-size:.9rem;margin:.25rem 0}
form{display:inline}
button{font:inherit;font-size:.88rem;background:var(--btn);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:.28rem .8rem;cursor:pointer;margin:.2rem .25rem .2rem 0}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
input[type=text],input:not([type]){font:inherit;font-size:.92rem;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;width:min(100%,30rem)}
ul{padding-left:1.2rem;margin:.3rem 0}
.actions{margin-top:1.1rem;padding-top:.8rem;border-top:1px dashed var(--line)}
nav{margin:1rem 0 0;display:flex;gap:.4rem}
nav a{color:var(--muted);text-decoration:none;padding:.25rem .8rem;border-radius:99px;border:1px solid transparent}
nav a.on{color:var(--text);border-color:var(--line);background:var(--card)}
select,input[type=date]{font:inherit;font-size:.92rem;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.33rem .5rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.entry{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.tally{color:var(--muted);font-size:.92rem;margin:.3rem 0 0}
</style></head><body>
<div class="top">
  <div><h1>{{ greeting }}</h1><p class="sub">Your work notebook</p></div>
  <form method="post" action="/theme"><input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ page }}">
    <input type="hidden" name="theme" value="{{ 'light' if theme == 'dark' else 'dark' }}">
    <button>{{ 'Switch to light' if theme == 'dark' else 'Switch to dark' }}</button></form>
</div>
<nav><a href="/" class="{{ 'on' if page == '/' }}">Today &amp; this week</a>
  <a href="/releases" class="{{ 'on' if page == '/releases' }}">Releases</a></nav>
<div class="note">This is a practice notebook. Everything in it is made-up demo data.</div>
{% if sync_warning %}<div class="note">{{ sync_warning }}</div>{% endif %}
{% if msg %}<div class="note">{{ msg }}</div>{% endif %}
{% block body %}{% endblock %}
</body></html>
